<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo...</title>
  <style>
      body {
        background-color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: sans-serif;
      }
      .loader {
        border: 4px solid #e2e8f0;
        border-top: 4px solid #0f172a;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
  </style>
</head>
<body>
  <div class="loader"></div>

  <script>
    // URL PÚBLICA DE TU NUEVA APLICACIÓN (Cámbiala por la tuya)
    const NUEVO_SAAS_URL = "https://seo-local-app.lovable.app/r/";
    
    // Extraemos el parámetro "k" (ej: qr001) de manera robusta
    const urlParams = new URLSearchParams(window.location.search);
    let k = urlParams.get('k');

    // Respaldo por si hay URLs viejas con estructuras diferentes
    if (!k) {
      const currentUrl = document.location.href;
      if (currentUrl.includes("k=")) {
        k = currentUrl.substr(currentUrl.lastIndexOf("k=")+2);
      }
    }
    
    if(k) {
      // Redirección instantánea sin pasar por Google Apps Script
      window.location.replace(NUEVO_SAAS_URL + k);
    } else {
      document.body.innerHTML = "<p style='color: #64748b;'>Enlace QR no reconocido.</p>";
    }
  </script>
</body>
</html>
