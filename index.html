<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo...</title>
  <style>
      body {
        background-color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: sans-serif;
      }
      .loader {
        border: 4px solid #e2e8f0;
        border-top: 4px solid #0f172a;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
  </style>
</head>
<body>
  <div class="loader"></div>

  <script>
    // URL PÚBLICA DE TU NUEVA APLICACIÓN
    const NUEVO_SAAS_URL = "https://seo-local-app.lovable.app/r/";
    
    // Función para obtener el parámetro de la URL
    function getSlug() {
      const urlParams = new URLSearchParams(window.location.search);
      let k = urlParams.get('k');

      // Respaldo para URLs antiguas con estructura diferente
      if (!k) {
        const currentUrl = document.location.href;
        if (currentUrl.includes("k=")) {
          k = currentUrl.substr(currentUrl.lastIndexOf("k=")+2);
        }
      }
      return k ? k.trim() : null;
    }
    
    const slug = getSlug();
    
    if(slug) {
      // Retraso de 100ms para asegurar estabilidad antes de la redirección
      setTimeout(() => {
        window.location.replace(NUEVO_SAAS_URL + slug);
      }, 100);
    } else {
      document.body.innerHTML = "<p style='color: #64748b; font-size: 14px;'>Enlace QR no reconocido o código faltante.</p>";
      console.error("No se detectó un slug (k) válido en la URL.");
    }
  </script>
</body>
</html>
